services:
  # ----------------------------------------------------------------
  # Production Service (Optimized static bundle served via Nginx)
  # Run: docker compose up -d web
  # ----------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avencis-website-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    environment:
      - NODE_ENV=production

  # ----------------------------------------------------------------
  # Development Service (Vite with hot-module reload & live volumes)
  # Run: docker compose up dev
  # ----------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: avencis-website-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
